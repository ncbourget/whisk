name: Check website
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate content and commerce behavior
        run: python3 -m unittest discover -s tests -v
      - name: Build portable static website
        run: python3 scripts/build.py --output _site
      - uses: actions/upload-artifact@v4
        with:
          name: whisk-website
          path: _site
          include-hidden-files: true
